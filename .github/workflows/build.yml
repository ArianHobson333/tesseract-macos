name: Build macOS binaries of Helium
on:
  workflow_dispatch:
    inputs:
      runner:
        required: false
        description: "Runner image name"
        default: "macos-latest"
      do-release:
        required: false
        type: boolean
        description: "Create a release after build is done"
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build macOS binaries of Helium
    strategy:
      matrix:
        arch: [arm64]
      fail-fast: true
      max-parallel: 1
    uses: ./.github/workflows/building.yml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      os: ${{ inputs.runner }}

  release:
    needs: build
    name: Release Tesseract
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.do-release }}
    environment: release
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Copy GitHub specific scripts to git-root folder
        run: cp -va ./.github/scripts/ ./
      - name: Disable Spotlight
        run: sudo mdutil -a -i off
      - name: Install coreutils
        run: brew install coreutils
      - name: Prepare release
        id: bake
        run: ./github_prepare_release.sh | tee -a github_actions_release.log
      - name: Get built arm64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.bake.outputs.arm64_file_name }}
      - name: Generate release note
        run: ./github_generate_release_note.sh | tee -a github_actions_release.log
      - name: List deltas
        id: list_deltas
        run: |
          {
            echo 'deltas<<EOF'
            find ./release_asset/ -name '*.delta'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Check notarization
        # No GitHub release and no appcast entry for a build that isn't notarized
        run: |
          dmg=./release_asset/${{ steps.bake.outputs.arm64_file_name }}
          assessment=$(spctl -a -vv -t install "$dmg" 2>&1) || { echo "$assessment"; exit 1; }
          echo "$assessment"
          grep -q 'source=Notarized Developer ID' <<< "$assessment"
          xcrun stapler validate "$dmg"
      - name: Release Tesseract
        uses: imputnet/action-gh-release@f0aaee5ca0734029d3612cf234fbc25f261b5036 # v2.5
        with:
          body_path: ./github_release_note.md
          draft: false
          prerelease: false
          files: |
            ./release_asset/${{ steps.bake.outputs.arm64_file_name }}
            ${{ steps.list_deltas.outputs.deltas }}
          name: ${{ steps.bake.outputs.release_name }}
          tag_name: ${{ steps.bake.outputs.release_tag_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Sparkle tools
        run: |
          curl -sfL -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir sparkle && tar -xJf sparkle.tar.xz -C sparkle ./bin/sign_update
      - name: Publish appcast
        env:
          TESSERACT_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.TESSERACT_SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_SIGN_UPDATE: ./sparkle/bin/sign_update
          GH_TOKEN: ${{ secrets.TESSERACT_SYNC_TOKEN }}
        run: |
          gh auth setup-git
          git config --global user.name "Tesseract release"
          git config --global user.email "release@users.noreply.github.com"
          ./github_publish_appcast.sh \
            "./release_asset/${{ steps.bake.outputs.arm64_file_name }}" \
            "${{ steps.bake.outputs.version }}" \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.bake.outputs.release_tag_version }}/${{ steps.bake.outputs.arm64_file_name }}"
