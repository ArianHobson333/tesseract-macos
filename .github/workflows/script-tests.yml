name: Script tests

on:
  push:
    paths: ['.github/scripts/**', 'tools/**', '.github/workflows/script-tests.yml']
  pull_request:
    paths: ['.github/scripts/**', 'tools/**', '.github/workflows/script-tests.yml']

permissions:
  contents: read

jobs:
  test:
    # hdiutil and spctl are macOS-only
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Sync script
        run: bash .github/scripts/tests/test_sync_upstream.sh
      - name: Release gate
        run: bash .github/scripts/tests/test_release_gate.sh
      - name: Perf parsers
        run: python3 -m pip install pytest && python3 -m pytest tools/perf/tests
