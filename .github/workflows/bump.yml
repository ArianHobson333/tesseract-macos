name: Bump helium-chromium submodule to latest version

on: workflow_dispatch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: true, fetch-depth: 0 }

      - name: Run bump-platform action from helium-chromium
        uses: imputnet/helium-chromium/.github/actions/bump-platform@f29a25968e483f8bb85e47829ccd487bbe229199 # helium 0.20.1.1
        with:
          token: ${{ secrets.GHPAT }}
